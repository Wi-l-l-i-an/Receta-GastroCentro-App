
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Receta Médica Gastrocentro de Occidente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="app-title">
    <h1>Receta Médica · Gastrocentro de Occidente</h1>
    <p>Completa los datos — la vista previa se actualiza en tiempo real.</p>
  </div>
 
  <div class="layout">
 
    <!-- ── Formulario ──────────────────────────────────────── -->
    <aside class="card">
      <h2>Datos del paciente</h2>

      <div class="recipe-controls">
        <label class="checkbox-option" for="enableSecondRecipe">
          <input id="enableSecondRecipe" type="checkbox">
          <span>Hacer 2 recetas en una hoja</span>
        </label>
        <div class="recipe-tabs" role="tablist" aria-label="Recetas de la hoja">
          <button class="recipe-tab active" id="recipeTab1" type="button" role="tab" aria-selected="true" aria-controls="patientFields">Receta 1</button>
          <button class="recipe-tab" id="recipeTab2" type="button" role="tab" aria-selected="false" aria-controls="patientFields" hidden>Receta 2</button>
        </div>
      </div>
 
      <div id="patientFields">
      <div class="field">
        <label for="nombre">Nombre del paciente</label>
        <input id="nombre" type="text" placeholder="Nombre completo" autocomplete="off">
      </div>
 
      <div class="field">
        <label for="edad">Edad</label>
        <input id="edad" type="number" placeholder="Ej. 42 años" autocomplete="off">
      </div>
 
      <div class="field">
        <label for="fecha">Fecha</label>
        <input id="fecha" type="date">
      </div>
 
      <div class="field">
        <label for="medicamentos">Receta (Rx) — frente</label>
        <textarea id="medicamentos" placeholder="Medicamentos y dosis…"></textarea>
      </div>
 
      <div class="field">
        <label for="diagnostico">Diagnóstico — reverso</label>
        <textarea id="diagnostico" placeholder="Diagnóstico detallado…"></textarea>
      </div>
      </div>
 
      <button class="btn-primary" id="btnPDF">⬇ Generar PDF (1 receta)</button>
    </aside>
 
    <!-- ── Vista previa ──────────────────────────────────── -->
    <main class="preview-panel">
      <div class="preview-tabs">
        <button class="tab-btn active" id="tabPreview" onclick="showTab('preview')">👁 Vista previa</button>
        <button class="tab-btn" id="tabPDF" onclick="showTab('pdf')">📄 PDF generado</button>
      </div>
 
      <div id="previewContainer"></div>
      <iframe id="pdfFrame" title="PDF generado"></iframe>
    </main>
 
  </div>
</div>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js" integrity="sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI" crossorigin="anonymous"></script>
<script src="script.js"></script>
<script>
function showTab(tab) {
  const preview = document.getElementById('previewContainer');
  const frame   = document.getElementById('pdfFrame');
  const tP      = document.getElementById('tabPreview');
  const tF      = document.getElementById('tabPDF');
 
  if (tab === 'preview') {
    preview.style.display = '';
    frame.classList.remove('visible');
    tP.classList.add('active');
    tF.classList.remove('active');
  } else {
    preview.style.display = 'none';
    frame.classList.add('visible');
    tP.classList.remove('active');
    tF.classList.add('active');
  }
}
 
</script>
</body>
</html>
